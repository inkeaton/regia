[project]
name = "regia-qscores"
version = "1.0.0"
description = "Computes the questionnaire metrics and figures reported in the Regia paper."
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.4,<3",
  "openpyxl>=3.1,<4",
  "pandas>=3.0,<3.1",  # 3.1 changes the last digit of a float in respondents.csv; the paper's CSVs need an exact match
  "scipy>=1.17,<2",
  "tabulate>=0.10,<1",  # pandas DataFrame.to_markdown, for summary.md
]

# Scripts only: install the dependencies, don't build qscores as a package.
[tool.uv]
package = false
