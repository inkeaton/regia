[project]
name = "regia"
version = "0.2.0"
description = "A Domain Specific Language for Game Designers to model Agent behaviour and Game flow, compiled to AgentSpeak."
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
  "click>=8.1,<9",  # cli
  "lark>=1.2,<2",  # parser
]

[project.scripts]
regia = "regia.cli:main"

# == Optional dependencies =====================================================
[project.optional-dependencies]
server = [  # API server for the visual editor
  "fastapi>=0.165,<1",
  "pydantic>=2.14,<3",
  "uvicorn>=0.54,<1",
]
benchmarks = [
  "matplotlib>=3.11,<4",
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "psutil>=7.2,<8",
  "scipy>=1.17,<2",
]
dev = [  # test suite
  "pytest>=9.2,<10",
  "syrupy>=7.0,<8",
]

# == Build system ==============================================================
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# == Pytest configuration ======================================================
[tool.pytest.ini_options]
testpaths = ["automated_tests"]

[tool.setuptools.packages.find]
where = ["src"]

# Include the .lark grammar file in the package
[tool.setuptools.package-data]
regia = ["grammars/*.lark"]
